<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Endless Road</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <button id="ambient-toggle" type="button" aria-label="Enter ambient mode" title="Ambient mode — tap the screen to restore controls">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.5 5.3A10.8 10.8 0 0112 5c5.5 0 9 7 9 7a16 16 0 01-3.2 4.2M6.2 6.2A18.8 18.8 0 003 12s3.5 7 9 7a10.3 10.3 0 005.1-1.6"/>
        </svg>
    </button>
    <button id="controls-toggle" type="button" aria-controls="debug-container" aria-expanded="false" aria-label="Open controls" title="Open controls">
        <svg class="controls-open-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h3m4 0h9M4 17h9m4 0h3"/>
            <circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>
        </svg>
        <svg class="controls-close-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
